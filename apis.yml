name: Witness AI
description: 'WitnessAI is an AI security and governance platform that lets enterprises
  safely deploy and manage AI across their workforce. Its platform spans three pillars:
  Observe (visibility into all AI activity, shadow-AI discovery, and cataloging of
  applications and agents), Control (governance policies, audit trails, and compliance
  across human and AI workforces), and Protect (runtime security that blocks prompt
  injection and jailbreaks and filters harmful outputs). It addresses data leakage,
  prompt-injection attacks, unauthorized agent activity, and compliance gaps. The
  company is backed by GV. As of this profile no public API, developer portal, or
  SDKs are published; engagement is via sales/demo.'
